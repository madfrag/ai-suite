name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # The storybook vitest project (addon-vitest) launches a real
      # Chromium via @vitest/browser-playwright to run each story's a11y
      # checks — needs the browser binary present, same as the other jobs
      # that use Playwright.
      - run: npx playwright install --with-deps chromium
      - run: npm run test

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Placeholder values so CI never depends on real secrets — the app
          # runs fine against these for markup/DOM purposes (what axe checks
          # and what the keyboard-navigation tests exercise).
          OPENAI_API_KEY: ci-placeholder
          HUGGINGFACE_API_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - uses: actions/upload-artifact@v6
        # Always publish, not just on failure — this is the WCAG 2.1 AA
        # conformance report (per-page axe results), which is worth having
        # as evidence even when every check passes.
        if: always()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 30

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          OPENAI_API_KEY: ci-placeholder
          HUGGINGFACE_API_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          OPENAI_API_KEY: ci-placeholder
          HUGGINGFACE_API_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - run: npm run test:visual
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: visual-regression-diffs
          # test-results/ holds the actual/expected/diff PNG triptych for any
          # failing screenshot comparison; the HTML report links them together.
          path: |
            playwright-visual-report/
            test-results/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          # Placeholder values so the build never depends on real secrets in CI.
          # Actual secrets live only in a hosting environment variables.
          OPENAI_API_KEY: ci-placeholder
          HUGGINGFACE_API_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - run: npm run check:bundle-size
